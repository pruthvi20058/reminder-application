<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo — Class Reminder &amp; Timetable</title>
<meta name="description" content="Tempo is a calm, beautiful home for your semester — live class countdowns, a weekly timetable, and reminders that actually reach you.">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f0d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">

<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    try {
      var raw = localStorage.getItem('tempo.v1');
      var pref = raw ? (JSON.parse(raw).settings || {}).theme : 'system';
      var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { /* noop */ }
  })();
</script>
</head>

<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="app" id="app">
    <!-- ── Sidebar ───────────────────────────────────────────── -->
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="#today" aria-label="Tempo home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <circle cx="16" cy="16" r="12.5" stroke="currentColor" stroke-width="1.6" opacity=".35"/>
            <circle cx="16" cy="16" r="12.5" stroke="currentColor" stroke-width="1.6"
                    stroke-dasharray="20 58.8" stroke-linecap="round" transform="rotate(-90 16 16)"/>
            <path d="M16 9.5V16l4.2 2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="16" r="1.9" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Tempo</span>
          <span class="brand-sub">semester companion</span>
        </span>
      </a>

      <nav class="nav" id="primary-nav">
        <a class="nav-item" href="#today" data-route="today">
          <span class="nav-ico" data-icon="sun"></span>
          <span>Today</span>
        </a>
        <a class="nav-item" href="#week" data-route="week">
          <span class="nav-ico" data-icon="calendar"></span>
          <span>Timetable</span>
        </a>
        <a class="nav-item" href="#reminders" data-route="reminders">
          <span class="nav-ico" data-icon="check"></span>
          <span>Reminders</span>
          <span class="nav-badge" id="nav-task-count" hidden>0</span>
        </a>
        <a class="nav-item" href="#settings" data-route="settings">
          <span class="nav-ico" data-icon="sliders"></span>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="daycard" id="side-daycard"><!-- filled by js --></div>
        <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">
          <span data-icon="moon"></span>
        </button>
      </div>
    </aside>

    <!-- ── Main ──────────────────────────────────────────────── -->
    <main class="main" id="main" tabindex="-1">
      <div id="view-root" class="view-root"></div>
    </main>

    <!-- ── Mobile tab bar ────────────────────────────────────── -->
    <nav class="tabbar" aria-label="Primary mobile">
      <a class="tab" href="#today" data-route="today">
        <span class="tab-ico" data-icon="sun"></span><span class="tab-label">Today</span>
      </a>
      <a class="tab" href="#week" data-route="week">
        <span class="tab-ico" data-icon="calendar"></span><span class="tab-label">Timetable</span>
      </a>
      <a class="tab" href="#reminders" data-route="reminders">
        <span class="tab-ico" data-icon="check"></span><span class="tab-label">Reminders</span>
        <span class="tab-badge" id="tab-task-count" hidden>0</span>
      </a>
      <a class="tab" href="#settings" data-route="settings">
        <span class="tab-ico" data-icon="sliders"></span><span class="tab-label">Settings</span>
      </a>
    </nav>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <div style="padding:32px;font-family:system-ui;max-width:520px;margin:0 auto">
      <h1 style="font-size:22px">Tempo needs JavaScript</h1>
      <p style="color:#666;line-height:1.6">Please enable JavaScript to use your timetable and reminders.</p>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
